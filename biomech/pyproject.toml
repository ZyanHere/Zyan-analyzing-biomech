[project]
name = "biomech"
version = "0.1.0"
description = "Real-time biomechanical analysis from a single monocular camera"
# 3.14, not 3.12: the pinned mediapipe build requires it. Declared here so pip
# refuses early with a clear message rather than failing deep in a wheel build.
requires-python = ">=3.14"

[project.scripts]
biomech = "biomech.__main__:main"

# Pinned like the runtime dependencies, and for the same reason: a reviewer who
# follows the README must get the toolchain the numbers were produced with.
# Declared here rather than in requirements.txt because they are needed to
# develop the package, not to run it.
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# research/ is the investigation record, deliberately not held to these rules.
# See docs/CODE_STANDARDS.md section 1.
exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/biomech --cov-report=term-missing"
